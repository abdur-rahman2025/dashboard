<!DOCTYPE html>
<html lang="en">
<head>

                        </div>
                    </div>
                    <div class="upper2chart3">
                        <div class="upper2chart3icon">

                        </div>
                        <div class="upper2chart3text">
                            <p>Chart 3</p>
                        </div>
                    </div>
                    <div class="upper2chart4">
                        <div class="upper2chart4icon">

                        </div>
                        <div class="upper2chart4text">
                            <p>Chart 4</p>
                        </div> 
                    </div>
